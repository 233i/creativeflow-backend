      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#6554E8" stop-opacity=".2" />
      <stop offset="1" stop-color="#6554E8" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      id="accent"
