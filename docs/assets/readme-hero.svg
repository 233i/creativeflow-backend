      <stop offset="1" stop-color="#63E3C1" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C9C7EB" opacity=".11" />
    </pattern>
  </defs>
