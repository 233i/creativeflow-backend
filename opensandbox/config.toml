[server]
host = "0.0.0.0"
port = 8090
# Replace this placeholder in an ignored local copy before starting OpenSandbox.
api_key = "REPLACE_WITH_LOCAL_OPENSANDBOX_API_KEY"
max_sandbox_timeout_seconds = 120

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.21"

[egress]
image = "opensandbox/egress:v1.1.5"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
pids_limit = 64
no_new_privileges = true
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
